<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LARP Activity Scanner</title>

<style>
:root {
    --bg: #050708;
    --panel: rgba(13, 18, 20, .88);
    --panel-2: rgba(18, 25, 27, .9);
    --line: rgba(255,255,255,.11);
    --line-strong: rgba(151,255,210,.35);
    --text: #f3f7f5;
    --muted: #82908b;
    --green: #72ffb2;
    --green-dim: #1fb66b;
    --amber: #ffcb67;
    --danger: #ff6f6f;
    --shadow: 0 24px 80px rgba(0,0,0,.5);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    min-height: 100vh;
    margin: 0;
    padding: 34px 16px 72px;
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 50% -10%, rgba(73,255,166,.11), transparent 38%),
        radial-gradient(circle at 100% 65%, rgba(34,107,77,.08), transparent 30%),
        var(--bg);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: .38;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
}

.container {
    width: min(94vw, 760px);
    margin: 0 auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: rgba(255,255,255,.025);
    font: 700 .68rem/1 monospace;
    letter-spacing: 1.7px;
    text-transform: uppercase;
}

.eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
}

h1 {
    margin: 0;
    color: var(--text);
    font-size: clamp(2.4rem, 9vw, 4.8rem);
    line-height: .9;
    letter-spacing: clamp(4px, 1.3vw, 10px);
    font-weight: 950;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(114,255,178,.12);
}

h1 span {
    color: var(--green);
}

.subtitle {
    margin: 15px 0 7px;
    color: #aab5b0;
    font-size: .95rem;
}

.motto {
    margin: 0;
    color: #68756f;
    font: italic 700 .7rem/1.4 monospace;
    letter-spacing: 1.2px;
}

.scanner-card {
    position: relative;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(22,29,31,.94), rgba(7,10,11,.96));
    box-shadow: var(--shadow);
    overflow: hidden;
}

.scanner-card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(120deg, rgba(114,255,178,.07), transparent 25%),
        radial-gradient(circle at 100% 0%, rgba(114,255,178,.07), transparent 30%);
}

.card-topbar {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 2px 5px 12px;
    color: #68756f;
    font: 700 .65rem monospace;
    letter-spacing: 1.4px;
    text-transform: uppercase;
}

.card-topbar .signal {
    color: var(--green);
}

.upload {
    position: relative;
    min-height: 190px;
    border: 1px dashed #3d4945;
    border-radius: 17px;
    cursor: pointer;
    transition: .25s ease;
    background:
        linear-gradient(135deg, rgba(114,255,178,.035), transparent 45%),
        rgba(5,8,9,.72);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding: 24px;
    color: var(--text);
    overflow: hidden;
}

.upload::after {
    content: "DROP IMAGE / IMPORT";
    position: absolute;
    right: 14px;
    bottom: 11px;
    color: rgba(255,255,255,.2);
    font: 600 .55rem monospace;
    letter-spacing: 1px;
}

.upload.hidden {
    display: none;
}

.upload:hover,
.upload:focus-within {
    border-color: var(--green-dim);
    background:
        linear-gradient(135deg, rgba(114,255,178,.08), transparent 45%),
        rgba(8,14,12,.9);
    transform: translateY(-1px);
}

.upload-icon {
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(114,255,178,.3);
    border-radius: 15px;
    color: var(--green);
    background: rgba(114,255,178,.07);
    font-size: 1.5rem;
    box-shadow: inset 0 0 24px rgba(114,255,178,.04);
}

.upload-title {
    font-size: 1rem;
    font-weight: 850;
    letter-spacing: .2px;
}

.upload-subtitle {
    color: var(--muted);
    font: .7rem monospace;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

input[type="file"] {
    display: none;
}

.preview {
    position: relative;
    width: 100%;
    max-height: 470px;
    margin-top: 12px;
    display: none;
    overflow: hidden;
    border-radius: 17px;
    background: #020303;
    border: 1px solid #34403c;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
}

.preview img {
    display: block;
    width: 100%;
    max-height: 470px;
    object-fit: contain;
}

.clear-image {
    position: absolute;
    z-index: 5;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    margin: 0;
    padding: 0;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: rgba(3,5,5,.78);
    color: #fff;
    font-size: 1.15rem;
    line-height: 1;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

.clear-image:hover {
    border-color: var(--danger);
    background: rgba(60,10,10,.82);
    color: #ffb0b0;
    transform: none;
}

.scanner {
    position: absolute;
    left: 0;
    width: 100%;
    height: 3px;
    top: 0;
    display: none;
    background: var(--green);
    box-shadow: 0 0 10px var(--green), 0 0 28px var(--green);
}

.scanning .scanner {
    display: block;
    animation: scan 2.5s linear infinite;
}

@keyframes scan {
    0% { top: 0%; }
    50% { top: calc(100% - 3px); }
    100% { top: 0%; }
}

.scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
    background:
        linear-gradient(rgba(114,255,178,.045), rgba(114,255,178,.045)),
        repeating-linear-gradient(
            to bottom,
            rgba(114,255,178,.055) 0 1px,
            transparent 1px 6px
        );
}

.scanning .scan-overlay {
    display: block;
}

.controls {
    display: flex;
    justify-content: center;
    margin-top: 14px;
}

button {
    border: 0;
    cursor: pointer;
    font: inherit;
}

#scanButton,
#againButton {
    display: none;
}

.primary-button {
    min-width: 220px;
    padding: 15px 25px;
    border: 1px solid rgba(114,255,178,.5);
    border-radius: 12px;
    background: var(--green);
    color: #041009;
    font-size: .84rem;
    font-weight: 950;
    letter-spacing: 1.6px;
    box-shadow: 0 0 30px rgba(114,255,178,.12);
    transition: .2s ease;
}

.primary-button:hover {
    background: #b4ffd5;
    box-shadow: 0 0 35px rgba(114,255,178,.23);
    transform: translateY(-1px);
}

.again {
    min-width: 170px;
    padding: 13px 22px;
    border: 1px solid #39443f;
    border-radius: 11px;
    background: #151b1b;
    color: #d7dedb;
    font-weight: 800;
    letter-spacing: .8px;
}

.again:hover {
    background: #202927;
    border-color: #56635d;
}

.status-wrap {
    min-height: 42px;
    margin-top: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.status {
    min-height: 26px;
    padding: 7px 11px;
    color: var(--green);
    font: 700 .65rem/1.1 monospace;
    letter-spacing: 1.4px;
    text-transform: uppercase;
}

.result {
    display: none;
    position: relative;
    margin: 13px 0 3px;
    padding: 27px 18px 24px;
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 30%, rgba(114,255,178,.13), transparent 45%),
        rgba(114,255,178,.025);
    animation: appear .5s cubic-bezier(.2,.8,.2,1);
}

.result::before {
    content: "ANALYSIS COMPLETE";
    display: block;
    margin-bottom: 12px;
    color: var(--green);
    font: 800 .62rem monospace;
    letter-spacing: 2px;
}

.result-number {
    font-size: clamp(4.5rem, 20vw, 9rem);
    font-weight: 950;
    line-height: .82;
    color: var(--green);
    letter-spacing: -5px;
    text-shadow: 0 0 30px rgba(114,255,178,.28);
}

.result-text {
    margin-top: 18px;
    color: #d9e2de;
    font-size: clamp(.85rem, 3.5vw, 1.1rem);
    letter-spacing: 4px;
    font-weight: 900;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.footer {
    margin-top: 30px;
    padding: 10px 0 0;
    text-align: center;
}

.footer-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.footer-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 112px;
    padding: 10px 14px;
    border: 1px solid #2c3532;
    border-radius: 9px;
    background: rgba(255,255,255,.025);
    color: #aeb8b4;
    text-decoration: none;
    font-weight: 750;
    font-size: .78rem;
    transition: .2s;
}

.coffee-button {
    min-width: 150px;
}

.footer-button:hover {
    border-color: #4d5c55;
    background: rgba(255,255,255,.055);
    color: #fff;
    transform: translateY(-1px);
}

.copyright {
    margin-top: 15px;
    color: #4f5a56;
    font-size: .68rem;
}

.version {
    position: fixed;
    left: 14px;
    bottom: 12px;
    color: #4f5a56;
    font: 700 .65rem monospace;
    letter-spacing: 1px;
    z-index: 1000;
    pointer-events: none;
}

@media (max-width: 560px) {
    body {
        padding-top: 24px;
    }

    .scanner-card {
        padding: 10px;
        border-radius: 19px;
    }

    .upload {
        min-height: 165px;
    }

    .upload::after {
        display: none;
    }

    .version {
        position: static;
        margin-top: 28px;
        text-align: center;
    }
}
</style>
</head>

<body>
<div class="container">

    <header class="header">
        <div class="eyebrow">VISUAL ANALYSIS UNIT // ONLINE</div>
        <h1>LARP <span>SCANNER</span></h1>
        <div class="subtitle">Upload an image to determine LARP activity.</div>
        <p class="motto">Made by larp haters, for larp haters.</p>
    </header>

    <main class="scanner-card">
        <div class="card-topbar">
            <span>SCAN TERMINAL / 01</span>
            <span class="signal">● SYSTEM READY</span>
        </div>

        <label class="upload" for="imageInput">
            <div class="upload-icon">⌁</div>
            <div class="upload-title">Click here to import an image</div>
            <div class="upload-subtitle">JPG · PNG · WEBP</div>
        </label>

        <input type="file" id="imageInput" accept="image/*">

        <div class="preview" id="preview">
            <img id="image" alt="Selected image">
            <button class="clear-image" id="clearButton" aria-label="Clear selected image" title="Clear image">×</button>
            <div class="scan-overlay"></div>
            <div class="scanner"></div>
        </div>

        <div class="controls">
            <button class="primary-button" id="scanButton">START SCAN</button>
        </div>

        <div class="status-wrap">
            <div class="status" id="status"></div>
        </div>

        <div class="result" id="result">
            <div class="result-number" id="number">0%</div>
            <div class="result-text">LARP ACTIVITY</div>
        </div>

        <div class="controls">
            <button class="again" id="againButton">SCAN AGAIN</button>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-buttons">
            <a href="#" class="footer-button" id="emailButton">✉ Email</a>
            <a href="#" class="footer-button coffee-button" id="coffeeButton">☕ Buy Me a coffee?</a>
            <a href="#" class="footer-button" id="instagramButton">◎ Instagram</a>
        </div>
        <div class="copyright">All Rights Reserved 2026.</div>
    </footer>
</div>

<div class="version">Pre-Alpha 1.0.3 CLBRSTR</div>

<script>
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const upload = document.querySelector(".upload");
const image = document.getElementById("image");
const clearButton = document.getElementById("clearButton");
const scanButton = document.getElementById("scanButton");
const againButton = document.getElementById("againButton");
const status = document.getElementById("status");
const result = document.getElementById("result");
const number = document.getElementById("number");

let selectedImage = false;

function clearImage() {
    imageInput.value = "";
    image.removeAttribute("src");
    preview.style.display = "none";
    upload.classList.remove("hidden");
    scanButton.style.display = "none";
    againButton.style.display = "none";
    result.style.display = "none";
    preview.classList.remove("scanning");
    status.textContent = "";
    selectedImage = false;
}

imageInput.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
        status.textContent = "PLEASE SELECT AN IMAGE";
        return;
    }

    const reader = new FileReader();

    reader.onload = function (e) {
        image.src = e.target.result;
        preview.style.display = "block";
        upload.classList.add("hidden");
        scanButton.style.display = "inline-block";
        againButton.style.display = "none";
        result.style.display = "none";
        status.textContent = "IMAGE READY";
        selectedImage = true;
    };

    reader.readAsDataURL(file);
});

clearButton.addEventListener("click", function () {
    clearImage();
});

scanButton.addEventListener("click", function () {
    if (!selectedImage) return;

    scanButton.style.display = "none";
    againButton.style.display = "none";
    result.style.display = "none";
    preview.classList.add("scanning");

    const messagePool = [
        "INITIALIZING SCANNER...",
        "ANALYZING IMAGE...",
        "DETECTING LARP SIGNAL...",
        "CALIBRATING VISUAL SENSORS...",
        "SCANNING FOR LARP ACTIVITY...",
        "CHECKING ENVIRONMENTAL CUES...",
        "READING VISUAL PATTERNS...",
        "CROSS-REFERENCING SIGNALS...",
        "MEASURING LARP INTENSITY...",
        "EXAMINING ACTIVITY LEVELS...",
        "PROCESSING IMAGE DATA...",
        "SEARCHING FOR LARP INDICATORS...",
        "ESTIMATING ACTIVITY DENSITY...",
        "ANALYZING BEHAVIORAL CUES...",
        "RUNNING LARP DETECTION MODEL...",
        "FILTERING VISUAL NOISE...",
        "VERIFYING SCAN RESULTS...",
        "COMPARING SIGNAL STRENGTH...",
        "CALCULATING ACTIVITY SCORE...",
        "PREPARING FINAL RESULT..."
    ];

    const shuffledMessages = [...messagePool].sort(() => Math.random() - 0.5);
    const messagesToShow = shuffledMessages.slice(0, Math.floor(Math.random() * 3) + 7);

    let messageIndex = 0;
    status.textContent = messagesToShow[0];

    const messageTimer = setInterval(() => {
        messageIndex++;
        if (messageIndex < messagesToShow.length) {
            status.textContent = messagesToShow[messageIndex];
        }
    }, 500);

    const randomNumber = Math.random() < 0.6
        ? Math.floor(Math.random() * 51) + 50
        : Math.floor(Math.random() * 49) + 1;

    setTimeout(() => {
        clearInterval(messageTimer);
        preview.classList.remove("scanning");
        status.textContent = "SCAN COMPLETE";

        setTimeout(() => {
            number.textContent = randomNumber + "%";
            result.style.display = "block";
            againButton.style.display = "inline-block";

            result.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }, 300);

    }, messagesToShow.length * 500 + 300);
});

againButton.addEventListener("click", function () {
    result.style.display = "none";
    status.textContent = "READY TO SCAN";
    scanButton.style.display = "inline-block";
    againButton.style.display = "none";
});

document.getElementById("coffeeButton").addEventListener("click", function(event) {
    event.preventDefault();
    alert("☕ Thanks for the support! (This is just a fake button for now.)");
});

document.getElementById("instagramButton").addEventListener("click", function(event) {
    event.preventDefault();
});

document.getElementById("emailButton").addEventListener("click", function(event) {
    event.preventDefault();
});
</script>
</body>
</html>
